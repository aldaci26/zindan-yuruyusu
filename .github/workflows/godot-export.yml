name: Windows derlemesi

on:
  push:
    branches: [main, entegrasyon]
    paths: ["godot/**", ".github/workflows/godot-export.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      # main -> son-surum, entegrasyon -> entegrasyon-surum
      TAG: ${{ github.ref_name == 'main' && 'son-surum' || format('{0}-surum', github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
      - name: Şablonları kur
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/export_templates/"
      - name: Derle
        working-directory: godot
        run: |
          mkdir -p build/windows
          godot --headless --import || true
          godot --headless --export-release "Windows" build/windows/CuceSavasci.exe
          cd build/windows && zip -r ../CuceSavasci-Windows.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CuceSavasci-Windows
          path: godot/build/CuceSavasci-Windows.zip
      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Cüce Savaşçı (${{ github.ref_name }})
          body: "Windows için indirilebilir oyun (${{ github.ref_name }} dalı). İmzasız olduğundan Windows ilk açılışta uyarı verebilir; ayrıntı: godot/README.md."
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: godot/build/CuceSavasci-Windows.zip
