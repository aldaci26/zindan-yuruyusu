name: Import CC0 fantasy graphics

on:
  push:
    branches:
      - wow
    paths:
      - ".github/workflows/import-quaternius-assets.yml"
      - "godot/tools/import_quaternius_assets.py"
      - "godot/tools/import_kaykit_assets.py"
      - "godot/tools/import_gobkit_assets.py"
      - "godot/tools/generate_painterly_atlas.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-cc0-graphics-wow
  cancel-in-progress: false

jobs:
  import-assets:
    name: Download, verify and commit CC0 fantasy graphics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout wow branch
        uses: actions/checkout@v4
        with:
          ref: wow
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install atlas generator dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.1.0

      - name: Import expanded Quaternius CC0 models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python godot/tools/import_quaternius_assets.py

      - name: Import KayKit CC0 characters, animations and dungeon assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python godot/tools/import_kaykit_assets.py

      - name: Import Gobkit CC0 animated creatures and nature
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python godot/tools/import_gobkit_assets.py

      - name: Generate original painterly-style atlas maps
        run: python godot/tools/generate_painterly_atlas.py

      - name: Commit imported graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/assets/wotlk/third_party/quaternius
          git add godot/assets/wotlk/creatures/wolf.glb
          git add godot/assets/third_party/kaykit
          git add godot/assets/third_party/gobkit
          git add godot/assets/materials/painterly_fantasy_*
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Import expanded CC0 fantasy models and painterly atlas maps"
          # Other CI or manual commits may advance wow while large asset packs download.
          git fetch origin wow
          git rebase origin/wow
          git push origin HEAD:wow
