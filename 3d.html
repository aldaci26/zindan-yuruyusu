<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var clamp = function(v, a, b){ return v < a ? a : (v > b ? b : v); };
var lerp = function(a, b, t){ return a + (b - a) * t; };

/* ---------- gürültü ve arazi ---------- */
function hash2(x, y){ var h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vn(x, y){
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function heightAt(x, z){
  var h = vn(x * 0.03, z * 0.03) * 16 + vn(x * 0.08, z * 0.08) * 4.5 + vn(x * 0.21, z * 0.21) * 0.9 - 9;

  var flat = clamp((d - 13) / 18, 0, 1);
  flat = flat * flat * (3 - 2 * flat);
  var edge = Math.max(0, (d - 78) / 20);
  return h * flat + edge * edge * 20;
}
var WORLD_R = 92;

/* ---------- sahne ---------- */
var SKY = 0x9fc8e8;
var scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 38, 125);
var cam = new THREE.PerspectiveCamera(58, 1, 0.1, 320);
var renderer = new THREE.WebGLRenderer({ canvas:$('#c'), antialias:true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
var hemi = new THREE.HemisphereLight(0xcfe4ff, 0x6a7886, 0.85); scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff0d2, 1.15);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
var sc = sun.shadow.camera; sc.left = -34; sc.right = 34; sc.top = 34; sc.bottom = -34; sc.near = 1; sc.far = 140;
sun.shadow.bias = -0.0006;
scene.add(sun); scene.add(sun.target);

function mat(c, o){ return new THREE.MeshStandardMaterial(Object.assign({ color:c, flatShading:true, roughness:0.85, metalness:0.05 }, o || {})); }
function mesh(g, m, cast){ var o = new THREE.Mesh(g, m); o.castShadow = cast !== false; o.receiveShadow = true; return o; }

/* arazi */
(function(){
  var seg = 130, size = 260;
  var g = new THREE.PlaneGeometry(size, size, seg, seg);
  g.rotateX(-Math.PI / 2);
  var pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  var snow = new THREE.Color(0xeef4fb), frost = new THREE.Color(0xc4d8ea), grass = new THREE.Color(0x6e9a58), rock = new THREE.Color(0x77818b), dirt = new THREE.Color(0x7a6a58), c = new THREE.Color();
  for (var i = 0; i < pos.count; i++){
    var x = pos.getX(i), z = pos.getZ(i), y = heightAt(x, z);
    pos.setY(i, y);
    var s = Math.max(Math.abs(heightAt(x + 1.2, z) - y), Math.abs(heightAt(x, z + 1.2) - y)) / 1.2;
    var n = vn(x * 0.11, z * 0.11), d = Math.hypot(x, z);
    c.copy(snow).lerp(frost, clamp(n * 1.2 - 0.2, 0, 1));
    var gp = clamp((0.58 - n) * 3 + (3 - y) * 0.08, 0, 1) * clamp(1.3 - Math.abs(y) / 9, 0, 1);
    c.lerp(grass, gp * 0.85);
    c.lerp(rock, clamp((s - 0.55) * 2.2, 0, 1));
    c.lerp(dirt, clamp((11 - d) / 5, 0, 1));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  var m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:0.95, metalness:0 }));
  m.receiveShadow = true; scene.add(m);
})();

/* uzak dağlar */
(function(){
  var m = mat(0x8fa3b8), cap = mat(0xf4f8fc);
  for (var i = 0; i < 26; i++){
    var a = i / 26 * Math.PI * 2 + hash2(i, 3) * 0.2, r = 135 + hash2(i, 9) * 25, h = 38 + hash2(i, 5) * 42, w = 24 + hash2(i, 7) * 18;
    var y = heightAt(Math.cos(a) * 100, Math.sin(a) * 100);
    var cone = mesh(new THREE.ConeGeometry(w, h, 6), m, false); cone.position.set(Math.cos(a) * r, h / 2 - 8, Math.sin(a) * r); cone.rotation.y = hash2(i, 1) * 3;
    var top = mesh(new THREE.ConeGeometry(w * 0.42, h * 0.38, 6), cap, false); top.position.set(cone.position.x, h * 0.81 - 8, cone.position.z); top.rotation.y = cone.rotation.y;
    scene.add(cone); scene.add(top);
  }
})();

/* engeller (çarpışma daireleri) */
var obs = [];
function addObs(x, z, r){ obs.push({ x:x, z:z, r:r }); }

/* ağaçlar ve kayalar (instanced) */
(function(){
  var rnd = (function(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(2026);
  var N = 260, trees = [];
  for (var tries = 0; tries < 3000 && trees.length < N; tries++){
    var a = rnd() * Math.PI * 2, r = 16 + Math.sqrt(rnd()) * 74, x = Math.cos(a) * r, z = Math.sin(a) * r;
    var ok = true;
    for (var k = 0; k < trees.length; k++){ if (Math.hypot(trees[k].x - x, trees[k].z - z) < 3.2){ ok = false; break; } }
    if (ok) trees.push({ x:x, z:z, s:0.8 + rnd() * 0.9, y:heightAt(x, z) });
  }
  var trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.4, 2.4, 6), mat(0x5a3d26), trees.length);
  var c1 = new THREE.InstancedMesh(new THREE.ConeGeometry(2.0, 3.4, 7), mat(0x2f5d3d), trees.length);
  var c2 = new THREE.InstancedMesh(new THREE.ConeGeometry(1.5, 2.8, 7), mat(0x3a7048), trees.length);
  var c3 = new THREE.InstancedMesh(new THREE.ConeGeometry(0.95, 2.2, 7), mat(0xf2f7fb), trees.length);
  var d = new THREE.Object3D();
  trees.forEach(function(t, i){
    function put(im, oy){ d.position.set(t.x, t.y + oy * t.s, t.z); d.scale.set(t.s, t.s, t.s); d.rotation.y = i; d.updateMatrix(); im.setMatrixAt(i, d.matrix); }
    put(trunk, 1.2); put(c1, 3.4); put(c2, 5.2); put(c3, 6.9);
    addObs(t.x, t.z, 0.55 * t.s);
  });
  [trunk, c1, c2, c3].forEach(function(im){ im.castShadow = true; im.receiveShadow = true; scene.add(im); });
  var rocks = [], rm = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), mat(0x7a8590), 50), rs = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.8, 0), mat(0xf0f5fa), 50);
  for (var q = 0; q < 50; q++){
    var a2 = rnd() * Math.PI * 2, r2 = 15 + rnd() * 75, x2 = Math.cos(a2) * r2, z2 = Math.sin(a2) * r2, s2 = 0.7 + rnd() * 1.6;
    d.position.set(x2, heightAt(x2, z2) + s2 * 0.35, z2); d.scale.set(s2, s2 * 0.75, s2); d.rotation.set(rnd() * 3, rnd() * 3, 0); d.updateMatrix(); rm.setMatrixAt(q, d.matrix);
    d.position.y += s2 * 0.45; d.scale.set(s2 * 0.7, s2 * 0.35, s2 * 0.7); d.updateMatrix(); rs.setMatrixAt(q, d.matrix);
    addObs(x2, z2, s2 * 0.9);
  }
  [rm, rs].forEach(function(im){ im.castShadow = true; im.receiveShadow = true; scene.add(im); });
})();

/* ---------- köy: kamp ateşi, evler, örs, sancaklar ---------- */
var fireLight, flame;
(function(){
  var stone = mat(0x8b939c), wood = mat(0x6a4a2e), roof = mat(0x8c3b2a), snowM = mat(0xf2f7fb), gold = mat(0xd9a93a, { metalness:0.6, roughness:0.4 }), blue = mat(0x2c4f9e, { side:THREE.DoubleSide });
  function house(x, z, rot, w, d){
    var g = new THREE.Group(), h = 3;
    var b = mesh(new THREE.BoxGeometry(w, h, d), stone); b.position.y = h / 2; g.add(b);
    var r = mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.78, 2.4, 4), roof); r.position.y = h + 1.2; r.rotation.y = Math.PI / 4; g.add(r);
    var sn = mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.6, 0.8, 4), snowM); sn.position.y = h + 2.0; sn.rotation.y = Math.PI / 4; g.add(sn);
    var door = mesh(new THREE.BoxGeometry(1.1, 1.9, 0.2), wood); door.position.set(0, 0.95, d / 2 + 0.05); g.add(door);
    var win = mesh(new THREE.BoxGeometry(0.8, 0.8, 0.15), mat(0xffd27a, { emissive:0xffa733, emissiveIntensity:0.9 }), false); win.position.set(w / 2 - 1, 1.9, d / 2 + 0.05); g.add(win);
    var ch = mesh(new THREE.BoxGeometry(0.7, 2, 0.7), stone); ch.position.set(-w / 3, h + 1.6, 0); g.add(ch);
    g.position.set(x, heightAt(x, z), z); g.rotation.y = rot; scene.add(g);
    addObs(x, z, Math.max(w, d) * 0.62);
  }
  house(-10, -4, 0.5, 6, 5); house(10, -3, -0.6, 6.5, 5); house(-8, 10, Math.PI - 0.3, 5.5, 5); house(11, 10, Math.PI + 0.5, 5, 4.5);
  // kamp atesi
  var fg = new THREE.Group();
  for (var i = 0; i < 6; i++){ var lg = mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.4, 5), wood); lg.rotation.z = Math.PI / 2.6; lg.rotation.y = i * Math.PI / 3; lg.position.y = 0.3; fg.add(lg); }
  for (var j = 0; j < 8; j++){ var st = mesh(new THREE.DodecahedronGeometry(0.28, 0), stone); st.position.set(Math.cos(j * 0.785) * 1.1, 0.15, Math.sin(j * 0.785) * 1.1); fg.add(st); }
  flame = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 6), new THREE.MeshBasicMaterial({ color:0xffa030 })); flame.position.y = 0.9; fg.add(flame);
  fireLight = new THREE.PointLight(0xff9a40, 1.4, 22, 2); fireLight.position.set(0, 1.6, 0); fg.add(fireLight);
  fg.position.set(0, heightAt(0, 0), 0); scene.add(fg); addObs(0, 0, 1.3);
  // ors
  var an = new THREE.Group();
  var ab = mesh(new THREE.BoxGeometry(0.8, 0.5, 1.6), mat(0x3a3f47, { metalness:0.6 })); ab.position.y = 0.75; an.add(ab);
  var ah = mesh(new THREE.BoxGeometry(0.5, 0.3, 0.6), mat(0x3a3f47, { metalness:0.6 })); ah.position.set(0, 1.1, 0.9); an.add(ah);
  var ak = mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), wood); ak.position.y = 0.3; an.add(ak);
  an.position.set(5, heightAt(5, 5), 5); an.rotation.y = 0.5; scene.add(an); addObs(5, 5, 1);
  // sancaklar
  [[-4, 12], [4, 13], [-3, -9], [3, -10]].forEach(function(p, i){
    var pole = mesh(new THREE.CylinderGeometry(0.07, 0.09, 5, 5), wood); var y0 = heightAt(p[0], p[1]); pole.position.set(p[0], y0 + 2.5, p[1]); scene.add(pole);
    var fl = mesh(new THREE.PlaneGeometry(1.2, 2), blue, false); fl.position.set(p[0] + 0.65, y0 + 3.9, p[1]); fl.rotation.y = i * 0.4; scene.add(fl);
    var tp = mesh(new THREE.SphereGeometry(0.14, 6, 5), gold); tp.position.set(p[0], y0 + 5.05, p[1]); scene.add(tp);
  });
})();

/* ---------- cüce savaşçı ---------- */
function makeDwarf(){
  var g = new THREE.Group(), rig = {};
  var skin = mat(0xe3a985), steel = mat(0x8196b0, { metalness:0.55, roughness:0.45 }), blue = mat(0x2a4fa3), gold = mat(0xdcae3e, { metalness:0.65, roughness:0.35 }), leather = mat(0x6a4325), beard = mat(0xc4561f), dark = mat(0x16181c);
  function pivot(x, y, z){ var p = new THREE.Group(); p.position.set(x, y, z); g.add(p); return p; }
  // bacaklar
  rig.legL = pivot(-0.24, 0.62, 0); rig.legR = pivot(0.24, 0.62, 0);
  [rig.legL, rig.legR].forEach(function(l){
    var up = mesh(new THREE.BoxGeometry(0.34, 0.4, 0.38), blue); up.position.y = -0.2; l.add(up);
    var boot = mesh(new THREE.BoxGeometry(0.4, 0.34, 0.52), leather); boot.position.set(0, -0.46, 0.05); l.add(boot);
    var cuff = mesh(new THREE.BoxGeometry(0.44, 0.08, 0.44), gold); cuff.position.y = -0.3; l.add(cuff);
  });
  // govde

function endPtr(e){

app.addEventListener('pointerup', endPtr); app.addEventListener('pointercancel', endPtr);
app.addEventListener('wheel', function(e){ camDist = clamp(camDist + e.deltaY * 0.01, 4, 14); }, { passive:true });
function tapSelect(sx, sy){
  var best = null, bd = 60;
  mobs.forEach(function(m){
    if (m.dead) return;
    vec.set(m.x, m.obj.position.y + 1.0 * m.ty.sc, m.z).project(cam);
    if (vec.z > 1) return;
    var px = (vec.x * 0.5 + 0.5) * innerWidth, py = (-vec.y * 0.5 + 0.5) * innerHeight, d = Math.hypot(px - sx, py - sy);

window.addEventListener('keydown', function(e){
  var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  if (k === 'f'){ usePotion(); return; }
  if (k === 'Tab'){ e.preventDefault(); var m = nearestMob(14); if (m) P.target = m; return; }

window.addEventListener('keyup', function(e){ var k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });

bind('#bAtk', toggleAuto); bind('#b1', function(){ ability(0); }); bind('#b2', function(){ ability(1); }); bind('#b3', function(){ ability(2); }); bind('#bP', usePotion);
$('#go').addEventListener('click', function(){ mode = 'play'; $('#ov').hidden = true; banner('KAR DAĞI VADİSİ', 'Cüce toprakları'); say('Kurtlar ve domuzlar vadide dolaşıyor. İyi avlar!', '#f2c75c'); });

/* ---------- guncelleme ---------- */
function collide(x, z, r){
  for (var i = 0; i < obs.length; i++){
    var o = obs[i], dx = x - o.x, dz = z - o.z, rr = r + o.r, d2 = dx * dx + dz * dz;
    if (d2 < rr * rr && d2 > 1e-6){ var d = Math.sqrt(d2); x = o.x + dx / d * rr; z = o.z + dz / d * rr; }
  }
  return { x:x, z:z };
}
function update(dt){
  T += dt;
  // girdi vektoru
  var ix = joy.x, iy = -joy.y;
  if (keys.a || keys.ArrowLeft) ix -= 1; if (keys.d || keys.ArrowRight) ix += 1;
  if (keys.w || keys.ArrowUp) iy += 1; if (keys.s || keys.ArrowDown) iy -= 1;
  if (keys.q) camYaw += dt * 1.8; if (keys.e) camYaw -= dt * 1.8;
  var il = Math.hypot(ix, iy); if (il > 1){ ix /= il; iy /= il; il = 1; }
  var moving = il > 0.12 && mode === 'play' && !P.dead;
  if (mode === 'title'){ camYaw += dt * 0.12; }
  // oyuncu
  if (!P.dead && mode === 'play'){
    var fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = -fz, rz = fx;
    var sp = 5.0;
    if (moving){
      var dx = fx * iy + rx * ix, dz = fz * iy + rz * ix, dl = Math.hypot(dx, dz) || 1; dx /= dl; dz /= dl;
      var nx = P.x + dx * sp * il * dt, nz = P.z + dz * sp * il * dt;
      var c = collide(nx, nz, 0.5); nx = c.x; nz = c.z;
      var rr = Math.hypot(nx, nz); if (rr > WORLD_R){ nx *= WORLD_R / rr; nz *= WORLD_R / rr; }
      P.x = nx; P.z = nz; P.auto = P.auto && !!(P.target && !P.target.dead);
      var ty = Math.atan2(dx, dz), dy = ((ty - P.yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI; P.yaw += dy * Math.min(1, dt * 14);
      P.spd = il;
    } else if (P.auto && P.target && !P.target.dead){
      var m = P.target, d0 = distTo(m);
      if (d0 > 1.8){ var vx = (m.x - P.x) / (d0 + m.ty.rad), vz = (m.z - P.z) / (d0 + m.ty.rad); var c2 = collide(P.x + vx * sp * dt, P.z + vz * sp * dt, 0.5); P.x = c2.x; P.z = c2.z; P.spd = 1; }
      else P.spd = 0;
      P.yaw = Math.atan2(m.x - P.x, m.z - P.z);
    } else P.spd = 0;
    P.atkT = Math.max(0, P.atkT - dt); P.gcd = Math.max(0, P.gcd - dt); P.potCd = Math.max(0, P.potCd - dt);
    for (var i = 0; i < 3; i++) P.cd[i] = Math.max(0, P.cd[i] - dt);
    if (P.auto && P.target && !P.target.dead && P.atkT <= 0) autoAttack();
    var ooc = !inCombat();
    P.hp = Math.min(maxHp(), P.hp + (ooc ? maxHp() * 0.015 : 0.3) * dt);
    if (ooc) P.rage = Math.max(0, P.rage - 4 * dt);
    if (P.target && (P.target.dead || Math.hypot(P.target.x - P.x, P.target.z - P.z) > 30)){ P.target = null; P.auto = false; }
  } else if (P.dead){
    P.spd = 0;
    if (T - P.deadT > 3.2){
      P.dead = false; P.hp = maxHp() * 0.6; P.rage = 0; P.x = 0; P.z = 7; P.combatT = -99; $('#dead').hidden = true;
      mobs.forEach(function(m){ if (m.state === 'chase') toHome(m); });
      say('Kamp ateşinde canlandın.', '#6aa8ff');
    }
  }
  P.y = heightAt(P.x, P.z);
  // canavarlar
  mobs.forEach(function(m){ mobUpdate(m, dt); });
  // animasyon
  P.walkPh += P.spd * dt * 9;
  var sw = Math.sin(P.walkPh) * 0.75 * P.spd;
  rig.legL.rotation.x = sw; rig.legR.rotation.x = -sw;
  rig.armL.rotation.x = -0.3 - sw * 0.35;
  var bob = Math.abs(Math.sin(P.walkPh)) * 0.07 * P.spd;
  if (P.swingT > 0){
    P.swingT += dt; var u = P.swingT / 0.38;
    if (u >= 1){ P.swingT = 0; rig.armR.rotation.x = sw * 0.35; rig.armR.rotation.z = 0; }
    else { rig.armR.rotation.x = lerp(-2.5, 0.5, u * u); rig.armR.rotation.z = 0; }
  } else { rig.armR.rotation.x = sw * 0.35 - 0.2 + Math.sin(T * 2) * 0.03; }
  rig.head.rotation.y = 0;
  player.position.set(P.x, P.y + bob, P.z); player.rotation.y = P.yaw;
  if (P.dead){ player.rotation.x = lerp(player.rotation.x, -1.4, Math.min(1, dt * 6)); player.position.y = P.y + 0.3; } else player.rotation.x = lerp(player.rotation.x, 0, Math.min(1, dt * 10));
  // kamera
  var cp = Math.cos(camPitch);
  var ctx = P.x + Math.sin(camYaw) * cp * camDist, cty = P.y + 1.9 + Math.sin(camPitch) * camDist, ctz = P.z + Math.cos(camYaw) * cp * camDist;
  var gh = heightAt(ctx, ctz) + 1.0; if (cty < gh) cty = gh;
  cam.position.set(ctx, cty, ctz); cam.lookAt(P.x, P.y + 1.5, P.z);
  sun.position.set(P.x + 28, P.y + 46, P.z + 18); sun.target.position.set(P.x, P.y, P.z); sun.target.updateMatrixWorld();
  // ates
  flame.scale.set(1 + Math.sin(T * 14) * 0.12, 1 + Math.sin(T * 11 + 1) * 0.2, 1 + Math.sin(T * 13) * 0.12);
  fireLight.intensity = 1.3 + Math.sin(T * 17) * 0.25 + Math.sin(T * 9) * 0.15;
  // kar
  var sp2 = snowPts.geometry.attributes.position.array;
  for (var s = 0; s < SN; s++){
    var j = s * 3; sp2[j + 1] -= (1.6 + (s % 5) * 0.25) * dt; sp2[j] += Math.sin(T * 0.7 + s) * 0.25 * dt;
    if (sp2[j + 1] < -2){ sp2[j + 1] = 24; }
  }
  snowPts.position.set(P.x, P.y, P.z); snowPts.geometry.attributes.position.needsUpdate = true;
  // halkalar
  for (var r = rings.length - 1; r >= 0; r--){
    var rg = rings[r]; rg.t += dt; var k = rg.t / rg.d;
    if (k >= 1){ scene.remove(rg.m); rg.m.geometry.dispose(); rg.m.material.dispose(); rings.splice(r, 1); continue; }
    rg.m.scale.setScalar(lerp(0.4, rg.r, k)); rg.m.material.opacity = 0.85 * (1 - k);
  }
}
function toHome(m){ m.state = 'return'; }
function mobUpdate(m, dt){
  var ty = m.ty, obj = m.obj;
  if (m.dead){
    var k = (T - m.diedAt);
    if (k < 0.8){ obj.rotation.z = lerp(0, 1.5, k / 0.8); obj.position.y = heightAt(m.x, m.z) + 0.1; }
    else if (k < 1.6){ obj.scale.setScalar(ty.sc * (1 - (k - 0.8) / 0.8) + 0.001); }
    else obj.visible = false;
    if (k > 32){ m.dead = false; m.hp = m.max; m.x = m.hx; m.z = m.hz; m.state = 'idle'; obj.visible = true; obj.rotation.z = 0; obj.scale.setScalar(ty.sc); }
    return;
  }
  var dx = P.x - m.x, dz = P.z - m.z, d = Math.hypot(dx, dz), moving = false;
  m.stun = Math.max(0, m.stun - dt);
  if (mode === 'play' && !P.dead && m.state === 'idle' && d < ty.aggro + (m.lvl - P.lvl) * 0.0 && !m.stunSkip){ m.state = 'chase'; }
  if (P.dead && m.state === 'chase') m.state = 'return';
  if (m.stun > 0){ /* sersem */ }
  else if (m.state === 'chase'){
    var hd = Math.hypot(m.x - m.hx, m.z - m.hz);
    if (hd > 38){ m.state = 'return'; }
    else if (d > ty.rad + 0.9){
      var sp = ty.spd; var nx = m.x + dx / d * sp * dt, nz = m.z + dz / d * sp * dt; var c = collide(nx, nz, ty.rad * 0.6); m.x = c.x; m.z = c.z; moving = true;
    }
    m.yaw = Math.atan2(dx, dz);
    m.atkT -= dt;
    if (d <= ty.rad + 1.3 && m.atkT <= 0){ m.atkT = 2.0; hurtPlayer(m.dmg * (0.85 + Math.random() * 0.3), m); m.lunge = 0.2; }
  } else if (m.state === 'return'){
    var rx = m.hx - m.x, rz = m.hz - m.z, rd = Math.hypot(rx, rz);
    if (rd < 0.6){ m.state = 'idle'; } else { m.x += rx / rd * ty.spd * 1.2 * dt; m.z += rz / rd * ty.spd * 1.2 * dt; m.yaw = Math.atan2(rx, rz); moving = true; }
    m.hp = Math.min(m.max, m.hp + m.max * 0.25 * dt);
  } else {

    if (m.wT <= 0){ m.wT = 2 + Math.random() * 4; var a = Math.random() * 6.28, r = Math.random() * 5; m.wx = m.hx + Math.cos(a) * r; m.wz = m.hz + Math.sin(a) * r; }
    var wx = m.wx - m.x, wz = m.wz - m.z, wd = Math.hypot(wx, wz);
    if (wd > 0.5){ m.x += wx / wd * 1.2 * dt; m.z += wz / wd * 1.2 * dt; m.yaw = Math.atan2(wx, wz); moving = true; }
  }
  if (m.lunge > 0) m.lunge -= dt;
  var y = heightAt(m.x, m.z);
  obj.position.set(m.x, y, m.z); obj.rotation.y = m.yaw; obj.rotation.z = 0;
  if (m.lunge > 0){ obj.position.x += Math.sin(m.yaw) * 0.25; obj.position.z += Math.cos(m.yaw) * 0.25; }

  var legs = obj.userData.legs, s = moving ? Math.sin(m.ph) * 0.7 : 0;
  legs[0].rotation.x = s; legs[3].rotation.x = s; legs[1].rotation.x = -s; legs[2].rotation.x = -s;

}

/* ---------- HUD ---------- */
function projectEl(el, x, y, z, ox, oy){
  vec.set(x, y, z).project(cam);
  if (vec.z > 1 || vec.z < -1){ el.style.display = 'none'; return false; }
  el.style.display = 'block';
  var px = (vec.x * 0.5 + 0.5) * innerWidth, py = (-vec.y * 0.5 + 0.5) * innerHeight;
  el.style.transform = 'translate(' + Math.round(px + (ox || 0)) + 'px,' + Math.round(py + (oy || 0)) + 'px) translate(-50%,-100%)';
  return true;
}
function lvlColor(l){ var d = l - P.lvl; return d >= 4 ? '#ff4a4a' : d >= 2 ? '#ff9a3a' : d >= -1 ? '#ffe45c' : d >= -3 ? '#7fe08a' : '#a8a8a8'; }
var hudT = 0;
function hud(dt){
  // dmg yazilari
  for (var i = floats.length - 1; i >= 0; i--){
    var f = floats[i]; f.t += dt;
    if (f.t > 1.1){ f.el.remove(); floats.splice(i, 1); continue; }
    projectEl(f.el, f.x, f.y + f.t * 1.1, f.z, 0, 0); f.el.style.opacity = f.t > 0.7 ? String(1 - (f.t - 0.7) / 0.4) : '1';
  }
  // isim levhalari
  mobs.forEach(function(m){
    var show = !m.dead && mode === 'play' && Math.hypot(m.x - P.x, m.z - P.z) < 22;
    if (!show){ m.plate.style.display = 'none'; return; }
    if (!projectEl(m.plate, m.x, m.obj.position.y + 1.7 * m.ty.sc + 0.3, m.z, 0, 0)) return;
    m.plateName.textContent = m.ty.name + ' ' + m.lvl; m.plateName.style.color = lvlColor(m.lvl);
    m.plateBar.style.width = Math.max(0, m.hp / m.max * 100) + '%';
    m.plate.style.outline = P.target === m ? '0' : '0';
    m.plate.firstChild.style.textDecoration = P.target === m ? 'underline' : 'none';
  });
  hudT += dt; if (hudT < 0.05) return; hudT = 0;
  $('#pl').textContent = 'Sv ' + P.lvl;
  $('#hpF').style.width = clamp(P.hp / maxHp() * 100, 0, 100) + '%'; $('#hpT').textContent = Math.max(0, Math.round(P.hp)) + '/' + maxHp();
  $('#rgF').style.width = P.rage + '%'; $('#rgT').textContent = 'Öfke ' + Math.round(P.rage);
  $('#xpF').style.width = (P.lvl >= 10 ? 100 : P.xp / xpNeed(P.lvl) * 100) + '%';
  var tf = $('#tf');
  if (P.target && !P.target.dead){
    var t = P.target; tf.className = 'hud frame show'; $('#tn').textContent = t.ty.name; $('#tn').style.color = lvlColor(t.lvl); $('#tl').textContent = 'Sv ' + t.lvl;
    $('#thF').style.width = Math.max(0, t.hp / t.max * 100) + '%'; $('#thT').textContent = Math.max(0, Math.round(t.hp)) + '/' + t.max;
  } else tf.className = 'hud frame';
  [['#b1', 0, 15], ['#b2', 1, 25], ['#b3', 2, 12]].forEach(function(a){
    var el = $(a[0]), cd = P.cd[a[1]], tot = [1, 6, 8][a[1]];
    el.querySelector('.cd').style.height = (cd > 0 ? clamp(cd / tot, 0, 1) * 100 : (P.gcd > 0 ? 100 * P.gcd / 0.9 * 0.4 : 0)) + '%';
    el.classList.toggle('off', P.rage < a[2]);
  });
  $('#bP .cd').style.height = (P.potCd > 0 ? P.potCd / 20 * 100 : 0) + '%'; $('#potN').textContent = P.pot; $('#bP').classList.toggle('off', P.pot <= 0);
  $('#bAtk').classList.toggle('on', P.auto);
}

/* ---------- dongu ---------- */
function resize(){
  var w = innerWidth, h = innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  cam.aspect = w / h; cam.fov = w / h < 0.8 ? 66 : 56; cam.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
var last = 0;
function frame(ts){
  var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
  update(dt); hud(dt);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (window.__TEST) window.__g3 = { P:P, mobs:mobs, update:update, ability:ability, toggleAuto:toggleAuto, setMode:function(m){ mode = m; }, cam:cam, scene:scene, usePotion:usePotion, setCam:function(y, p){ camYaw = y; camPitch = p; } };
})();
