<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zindan Yürüyüşü">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<title>Zindan Yürüyüşü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Düzen: dikey telefon ekranı (iPhone 12, 390x844). Dünya tüm ekranı kaplar, HUD ve kontroller üstüne biner.
   Sol üst: karakter ve hedef çerçevesi. Sağ üst: mini harita ve menü. Sağ alt: yetenek yayı. Sol alt: yüzen joystick. */
:root{
  --bg:#0b1115;
  --panel:rgba(14,21,26,.82);
  --panel-solid:#121c22;
  --edge:#6a5628;
  --ink:#eef2ee;
  --muted:#93a6a6;
  --gold:#f2c75c;
  --hp:#43d17f;
  --mp:#4a8dff;
  --xp:#a35cf0;
  --danger:#f0604a;
  --font-display:"Cinzel", Georgia, "Times New Roman", serif;
  --font-ui:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:12px/1.35 var(--font-ui)}
[hidden]{display:none!important}
button{font-family:var(--font-ui);color:var(--ink);cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.game{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:6px}

/* sol üst */
.left{position:absolute;top:10px;left:max(16px, env(safe-area-inset-left, 0px));width:150px;display:flex;flex-direction:column;gap:6px}
.pf,.tf{padding:5px 7px;display:flex;flex-direction:column;gap:3px}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.row1 b{font:800 13px/1.2 var(--font-display);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row1 span{font-size:10px;color:var(--muted);white-space:nowrap}
.bar{position:relative;height:13px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden}
.bar.thin{height:5px}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .12s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
#hpF,#tfF{background:var(--hp)}
.low #hpF{background:var(--danger)}
#mpF{background:var(--mp)}
#xpF{background:var(--xp)}
.qt{padding:5px 7px;font-size:10.5px;display:flex;flex-direction:column;gap:3px;max-width:150px}
.qt b{color:var(--gold);font-weight:800}
.qt div{color:var(--ink)}
.qt small{color:var(--muted);font-size:10px}
.qt:empty{display:none}

/* sağ üst */
.right{position:absolute;top:10px;right:max(16px, env(safe-area-inset-right, 0px));width:92px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.mmw{width:92px;height:92px;border:2px solid var(--edge);border-radius:8px;overflow:hidden;background:#000;pointer-events:auto}
#mm{width:100%;height:100%;display:block}
.zn{font-size:10px;color:var(--ink);text-align:right;text-shadow:0 1px 3px #000;max-width:150px;font-weight:800}
.menu{display:flex;gap:4px;pointer-events:auto}
.menu button{width:29px;height:29px;padding:0;font-size:15px;line-height:1;background:var(--panel);border:1px solid var(--edge);border-radius:6px}
.menu button:active{background:var(--edge)}

/* orta üst */
.banner{position:absolute;top:22%;left:0;right:0;text-align:center;opacity:0;text-shadow:0 2px 6px #000}
.banner b{display:block;font:800 26px/1.15 var(--font-display);color:var(--gold);letter-spacing:.06em;padding:0 16px;text-wrap:balance}
.banner small{display:block;font-size:12px;color:var(--ink);margin-top:2px}
@keyframes ban{0%{opacity:0;transform:translateY(-8px)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}

/* alt */
.log{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));bottom:14px;width:calc(100% - 250px);min-width:120px;display:flex;flex-direction:column;gap:1px;font-size:10.5px;text-shadow:0 1px 3px #000,0 0 6px #000}
.log p{margin:0}
.log:not(:empty){background:rgba(10,15,18,.55);border-radius:6px;padding:4px 7px}
.actions{position:absolute;right:max(14px, env(safe-area-inset-right, 0px));bottom:14px;width:210px;height:200px;pointer-events:none}
.act{position:absolute;border-radius:50%;background:var(--panel);border:2px solid var(--edge);padding:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;overflow:hidden;font-size:22px;line-height:1}
.act:active{background:var(--edge)}
.act .cm{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;font-weight:800;color:var(--mp);text-shadow:0 1px 2px #000}
.act .cn{position:absolute;top:1px;right:5px;font-size:10px;font-weight:800;color:var(--gold);text-shadow:0 1px 2px #000}
.act .cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,12,15,.78);font:800 16px var(--font-display);color:var(--ink)}
.act.cool .cd,.act.lock .cd{display:flex}
.act.lock .cm{display:none}
.act.off{opacity:.55}
.act.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,199,92,.35)}
.act.big{font-size:32px;border-color:var(--gold)}
.talk{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:222px;padding:9px 14px;background:var(--gold);color:#1b1405;border:0;border-radius:18px;font-weight:800;font-size:12px;pointer-events:auto;display:none}
.talk.show{display:block}
.castbar{position:absolute;left:50%;bottom:268px;transform:translateX(-50%);width:170px;height:17px;background:rgba(0,0,0,.7);border:1px solid var(--edge);border-radius:4px;overflow:hidden;pointer-events:none}
.castbar i{position:absolute;inset:0 auto 0 0;width:0;background:#c9962c}
.castbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.bar.rest #xpF{background:#59a9ff}

/* joystick */
#joy{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:2px solid rgba(242,199,92,.5);background:rgba(14,21,26,.35);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(242,199,92,.55);border:2px solid var(--gold)}

/* paneller */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;display:flex;flex-direction:column;background:var(--panel-solid);border-top:2px solid var(--edge);z-index:30;touch-action:pan-y}
.sheet[hidden],.ov[hidden]{display:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px))}
.sh-head b{font:800 18px/1.2 var(--font-display);color:var(--gold);letter-spacing:.03em}
.sh-head button{width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--edge);font-size:15px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:10px;font-size:12.5px;line-height:1.45;overscroll-behavior:contain}
.sh-body p{margin:0}
.sh-body h3{margin:0;font:800 12px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:42px;padding:8px 12px;background:var(--panel);border:1px solid var(--edge);border-radius:8px;font-size:12.5px;text-align:left;display:flex;flex-direction:column;gap:2px}
.btn small{color:var(--muted);font-size:11px}
.btn:active{background:var(--edge)}
.btn.gold{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.btn.gold small{color:#4a3a10}
.btn[disabled]{opacity:.45}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.kv span:nth-child(even){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.q{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--edge);border-radius:8px;background:var(--panel)}
.q b{color:var(--gold)}
.q small{color:var(--muted)}
.mapc{width:100%;max-width:340px;aspect-ratio:1;align-self:center;border:2px solid var(--edge);border-radius:6px;image-rendering:pixelated;background:#000}

/* tam ekran perde */
.ov{position:absolute;inset:0;z-index:40;background:rgba(8,12,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px));overflow-y:auto;touch-action:pan-y}
.ov h1{margin:0;font:800 30px/1.1 var(--font-display);color:var(--gold);letter-spacing:.05em;text-wrap:balance}
.ov h2{margin:0;font:800 24px/1.15 var(--font-display);color:var(--gold);text-wrap:balance}
.ov p{margin:0;color:var(--muted);max-width:30ch;font-size:13px}
.ov .sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:var(--panel);border:1px solid var(--edge);border-radius:8px;min-height:56px}
.choice:active{background:var(--edge)}
.choice .em{font-size:30px;line-height:1}
.choice b{display:block;font:800 16px/1.2 var(--font-display);letter-spacing:.03em}
.choice small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.ov input{width:100%;max-width:320px;box-sizing:border-box;padding:11px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:8px;font:16px var(--font-ui);text-align:center;-webkit-user-select:text;user-select:text}
.ov .primary{background:var(--gold);color:#1b1405;border:0;border-radius:8px;padding:12px 22px;font:800 15px var(--font-display);letter-spacing:.04em;min-width:200px}
.ov .primary:active{background:var(--ink)}
</style>

</head>
<body>
<div class="game" id="game">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="left">
      <div class="pf panel" id="pf">
        <div class="row1"><b id="pfName"></b><span id="pfLv"></span></div>
        <div class="bar" id="hpBar"><i id="hpF"></i><span id="hpT"></span></div>
        <div class="bar"><i id="mpF"></i><span id="mpT"></span></div>
        <div class="bar thin"><i id="xpF"></i></div>
      </div>
      <div class="tf panel" id="tf" hidden>
        <div class="row1"><b id="tfName"></b><span id="tfLv"></span></div>
        <div class="bar"><i id="tfF"></i><span id="tfT"></span></div>
      </div>
      <div class="qt panel" id="qt"></div>
    </div>

    <div class="right">
      <div class="mmw" id="mmw"><canvas id="mm"></canvas></div>
      <div class="zn" id="zn"></div>
      <div class="menu">
        <button type="button" id="bChar" aria-label="Karakter">🎒</button>
        <button type="button" id="bQuest" aria-label="Görevler">📜</button>
        <button type="button" id="bMap" aria-label="Harita">🗺️</button>
      </div>
    </div>

    <div class="banner" id="banner"><b id="banT"></b><small id="banS"></small></div>
    <div class="log" id="log" aria-live="polite"></div>
  </div>

  <div id="joy"><i id="knob"></i></div>
  <div class="actions" id="actions"></div>
  <button class="talk" id="talk" type="button"></button>
  <div class="castbar" id="castbar" hidden><i id="castF"></i><span id="castT"></span></div>

  <div class="sheet" id="sheet" hidden>
    <div class="sh-head"><b id="shT"></b><button type="button" id="shX" aria-label="Kapat">✕</button></div>
    <div class="sh-body" id="shB"></div>
  </div>
  <div class="ov" id="ov"></div>
</div>

<script>

'use strict';
var $ = function(s){ return document.querySelector(s); };
var cv = $('#cv'), ctx = cv.getContext('2d');
var mmc = $('#mm'), mctx = mmc.getContext('2d');
var TW = 80, TH = 80;

var FONT_EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ---------- rastgelelik ve gürültü ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y){ var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y, sc, seed){
  x = x / sc; y = y / sc;
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var n = function(a, b){ return hash(a + seed * 131, b + seed * 733); };
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return (n(xi, yi) * (1 - u) + n(xi + 1, yi) * u) * (1 - v) + (n(xi, yi + 1) * (1 - u) + n(xi + 1, yi + 1) * u) * v;
}
var rng = mulberry32(20261105);
var rnd = function(n){ return Math.floor(Math.random() * n); };
var clamp = function(v, a, b){ return v < a ? a : (v > b ? b : v); };

  [ { id:'selin', name:'Avcı Selin',    role:'quest', c:'🧑‍🌾', ox:0,  oy:-2 }, { id:'mora',  name:'Şifacı Mora',  role:'heal', c:'🧑‍⚕️', ox:-2, oy:1 }, { id:'kerem', name:'Tüccar Kerem', role:'shop', c:'🧑‍💼', ox:2, oy:1 } ],
  [ { id:'harun', name:'Kâhya Harun',   role:'quest', c:'🧑‍🌾', ox:0,  oy:-2 }, { id:'naz',   name:'Şifacı Naz',   role:'heal', c:'🧑‍⚕️', ox:-2, oy:1 }, { id:'cem',   name:'Tüccar Cem',   role:'shop', c:'🧑‍💼', ox:2, oy:1 } ],
  [ { id:'ada',   name:'Komutan Ada',   role:'quest', c:'🧑‍🌾', ox:0,  oy:-2 }, { id:'lale',  name:'Şifacı Lale',  role:'heal', c:'🧑‍⚕️', ox:-2, oy:1 }, { id:'bora',  name:'Tüccar Bora',  role:'shop', c:'🧑‍💼', ox:2, oy:1 } ]

NPCDEF.forEach(function(a, i){ a.push({ id:'fly' + i, name:'Uçuş Ustası', role:'fly', c:'🧑‍✈️', ox:0, oy:3 }); });

].map(function(a){ return { z:a[0], name:a[1], c:a[2], lo:a[3], hi:a[4], f:a[5], fd:a[6], sp:a[7], ag:a[8] }; });
var BOSS = { name:'Buz Ejderhası', c:'🐉', lvl:20, f:6, fd:1.15, sp:2.0, ag:6, boss:true, final:true, x:40, y:6 };
var MINIBOSS = [

  { z:2, name:'Kum Solucanı',      c:'🪱', lvl:14, f:3.6, fd:1.25, sp:2.4, ag:5, boss:true }
];

var QUESTS = [
  { id:'q1',  giver:'belin', title:'Kurt Sürüsü',        kind:'kill', target:'Kurt',            n:5,  lvl:1,  prev:null, xp:60,   gold:15,   text:'Köyün çevresinde kurtlar çoğaldı. Beş tanesini avla.' },
  { id:'q2',  giver:'belin', title:'Fare İstilası',      kind:'kill', target:'Fare',            n:6,  lvl:1,  prev:null, xp:70,   gold:20,   text:'Ambarları fareler bastı. Altı fare temizle.' },

/* ---------- dünya üretimi ---------- */
var tiles = new Uint8Array(TW * TH), deco = new Uint8Array(TW * TH), zoneMap = new Uint8Array(TW * TH);
function idx(x, y){ return y * TW + x; }
function inB(x, y){ return x >= 0 && y >= 0 && x < TW && y < TH; }
function distTownMin(x, y){ var m = 1e9; for (var i = 0; i < TOWNS.length; i++){ var d = Math.hypot(x - TOWNS[i].x, y - TOWNS[i].y); if (d < m) m = d; } return m; }
function zoneAtTile(x, y){
  var yy = y + (vnoise(x, y, 9, 5) - 0.5) * 7;
  if (yy >= 48) return 0;
  if (yy < 24) return 3;
  var xx = x + (vnoise(x, y, 9, 9) - 0.5) * 7;
  return xx < 40 ? 1 : 2;
}
function biomeOf(z){ return z === 0 ? T_GRASS : z === 1 ? T_FOREST : z === 2 ? T_SAND : T_SNOW; }
function setRoad(x, y){ if (inB(x, y)){ tiles[idx(x, y)] = T_ROAD; deco[idx(x, y)] = 0; } }
function seg(x0, y0, x1, y1){
  var dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0), x = x0, y = y0;
  for (var g = 0; g < 400; g++){
    setRoad(x, y); setRoad(x + 1, y); setRoad(x, y + 1);
    if (x === x1 && y === y1) break;
    if (x !== x1) x += dx; else y += dy;
  }
}
function buildWorld(){
  var x, y, i;
  for (y = 0; y < TH; y++) for (x = 0; x < TW; x++){
    i = idx(x, y);
    var z = zoneAtTile(x, y); zoneMap[i] = z; tiles[i] = biomeOf(z);
    if (vnoise(x, y, 11, 3) > (z === 2 ? 0.8 : 0.72) && distTownMin(x, y) > 10 && Math.hypot(x - 40, y - 8) > 7) tiles[i] = T_WATER;
  }
  seg(40, 62, 12, 62); seg(12, 62, 12, 36);
  seg(40, 62, 68, 62); seg(68, 62, 68, 36);
  seg(12, 36, 12, 16); seg(12, 16, 40, 16);
  seg(68, 36, 68, 16); seg(68, 16, 40, 16);
  for (y = 0; y < TH; y++) for (x = 0; x < TW; x++){
    i = idx(x, y);
    if (tiles[i] === T_WATER || tiles[i] === T_ROAD) continue;
    if (distTownMin(x, y) < 6.2 || Math.hypot(x - 40, y - 8) < 4.5) continue;
    var z2 = zoneMap[i], r = hash(x * 3 + 7, y * 5 + 1), r2 = hash(x * 11 + 3, y * 7 + 9), dn = vnoise(x, y, 6, 7);
    if (z2 === 0){ if (r < 0.035 + Math.max(0, dn - 0.5) * 0.5) deco[i] = r2 < 0.2 ? 4 : 1; }
    else if (z2 === 1){ if (r < Math.max(0.05, 0.17 + (dn - 0.5) * 0.5)) deco[i] = r2 < 0.12 ? 4 : (r2 < 0.55 ? 2 : 1); }
    else if (z2 === 2){ if (r < 0.045) deco[i] = r2 < 0.5 ? 3 : (r2 < 0.8 ? 4 : 9); }
    else { if (r < Math.max(0.03, 0.09 + (dn - 0.5) * 0.3)) deco[i] = r2 < 0.15 ? 4 : 2; }
  }
  for (x = 0; x < TW; x++){ deco[idx(x, 0)] = 4; deco[idx(x, TH - 1)] = 4; }
  for (y = 0; y < TH; y++){ deco[idx(0, y)] = 4; deco[idx(TW - 1, y)] = 4; }
  TOWNS.forEach(function(t){
    var dy, dx;
    for (dy = -6; dy <= 6; dy++) for (dx = -6; dx <= 6; dx++){
      var tx = t.x + dx, ty = t.y + dy; if (!inB(tx, ty)) continue;
      var rr = Math.hypot(dx, dy), k = idx(tx, ty);
      if (rr <= 5.4){ deco[k] = 0; if (tiles[k] === T_WATER) tiles[k] = biomeOf(t.zone); }
      if (rr <= 3.4) tiles[k] = T_ROAD;
    }
    var hs = t.zone === 2 ? [7] : (t.zone === 1 ? [6] : [5, 6]);
    [[-4,-3],[4,-3],[-4,3],[4,3]].forEach(function(o, n){ deco[idx(t.x + o[0], t.y + o[1])] = hs[n % hs.length]; });
    deco[idx(t.x, t.y - 5)] = t.zone === 3 ? 8 : (t.zone === 2 ? 7 : 6);
    deco[idx(t.x, t.y)] = 10;
  });
  for (y = 2; y <= 10; y++) for (x = 36; x <= 44; x++){
    if (Math.hypot(x - 40, y - 6) <= 4.6){ i = idx(x, y); deco[i] = 0; if (tiles[i] === T_WATER || tiles[i] === T_ROAD) tiles[i] = T_SNOW; }
  }
}
buildWorld();

function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function walkable(x, y){
  var tx = Math.floor(x), ty = Math.floor(y);
  if (!inB(tx, ty)) return false;
  var i = idx(tx, ty);
  return tiles[i] !== T_WATER && deco[i] === 0;
}
function canStand(x, y, r){ return walkable(x - r, y - r) && walkable(x + r, y - r) && walkable(x - r, y + r) && walkable(x + r, y + r); }
function moveEnt(e, dx, dy, r){
  if (dx && canStand(e.x + dx, e.y, r)) e.x += dx;
  if (dy && canStand(e.x, e.y + dy, r)) e.y += dy;
}
function nearTown(x, y, r){ for (var i = 0; i < TOWNS.length; i++){ if (Math.hypot(x - (TOWNS[i].x + 0.5), y - (TOWNS[i].y + 0.5)) < r) return i; } return -1; }
function nearestTown(x, y){ var b = 0, bd = 1e9; for (var i = 0; i < TOWNS.length; i++){ var d = Math.hypot(x - TOWNS[i].x, y - TOWNS[i].y); if (d < bd){ bd = d; b = i; } } return b; }

function spawnWorld(){
  mobs = []; npcs = []; herbs = [];
  var counts = [44, 26, 26, 40];
  var r = mulberry32(777), id = 0;
  ZONES.forEach(function(zn, zi){
    var made = 0, tries = 0, types = MT.filter(function(t){ return t.z === zi; });
    while (made < counts[zi] && tries < 4000){
      tries++;
      var x = 1 + Math.floor(r() * (TW - 2)), y = 1 + Math.floor(r() * (TH - 2));
      if (zoneMap[idx(x, y)] !== zi || !walkable(x + 0.5, y + 0.5) || tiles[idx(x, y)] === T_ROAD) continue;
      if (distTownMin(x, y) < 8 || Math.hypot(x - 40, y - 6) < 7) continue;
      var tn = TOWNS[zn.town];
      var t = clamp(Math.hypot(x - tn.x, y - tn.y) / 24, 0, 1);
      var lvl = clamp(Math.round(zn.lo + t * (zn.hi - zn.lo) + (r() - 0.5) * 1.6), zn.lo, zn.hi);
      var cand = types.filter(function(m){ return lvl >= m.lo && lvl <= m.hi; });
      if (!cand.length) cand = types;
      var ty = cand[Math.floor(r() * cand.length)];
      lvl = clamp(lvl, ty.lo, ty.hi);
      var mk = makeMob(id++, ty, lvl, x + 0.5, y + 0.5);
      if (r() < 0.07){ mk.elite = true; mk.max = mk.hp = Math.round(mk.max * 2.6); mk.dmg *= 1.5; }
      mobs.push(mk);
      made++;
    }
  });
  mobs.push(makeMob(id++, BOSS, BOSS.lvl, BOSS.x + 0.5, BOSS.y + 0.5));
  MINIBOSS.forEach(function(b){
    for (var tr = 0; tr < 6000; tr++){
      var bx = 1 + Math.floor(r() * (TW - 2)), by = 1 + Math.floor(r() * (TH - 2));
      if (zoneMap[idx(bx, by)] !== b.z || !walkable(bx + 0.5, by + 0.5) || tiles[idx(bx, by)] === T_ROAD || distTownMin(bx, by) < 14) continue;
      mobs.push(makeMob(id++, b, b.lvl, bx + 0.5, by + 0.5)); break;
    }
  });
  TOWNS.forEach(function(t, ti){
    NPCDEF[ti].forEach(function(d){ npcs.push({ id:d.id, name:d.name, role:d.role, c:d.c, x:t.x + d.ox + 0.5, y:t.y + d.oy + 0.5, town:ti }); });
  });
  var hr = mulberry32(4242), hm = 0, ht = 0;
  while (hm < 50 && ht < 3000){
    ht++;
    var hx = 1 + Math.floor(hr() * (TW - 2)), hy = 1 + Math.floor(hr() * (TH - 2));
    if (!walkable(hx + 0.5, hy + 0.5) || tiles[idx(hx, hy)] === T_ROAD || distTownMin(hx, hy) < 6) continue;
    herbs.push({ x:hx + 0.5, y:hy + 0.5, at:0 });
    hm++;
  }
}
function makeMob(id, ty, lvl, x, y){
  var hp = Math.round((12 + 11 * lvl) * ty.f);
  return { id:id, name:ty.name, c:ty.c, lvl:lvl, hp:hp, max:hp, dmg:(1.8 + 1.5 * lvl) * ty.fd, sp:ty.sp, ag:ty.ag, boss:!!ty.boss, final:!!ty.final, elite:false,
           x:x, y:y, hx:x, hy:y, state:'idle', dead:false, diedAt:0, respawn:0, atkT:0.8, wT:1 + Math.random() * 3, wx:x, wy:y, slowT:0, stuck:0 };
}

function inCombat(){ return T - P.lastCombat < 5; }
function dismount(){ if (P.mounted){ P.mounted = false; } }
function takeDamage(m, r, col){
  if (m.dead) return;
  m.hp -= r.v;
  floatText(m.x, m.y - 0.6, (r.crit ? '' : '') + r.v, r.crit ? '#ffd23a' : (col || '#ffffff'), r.crit);
  P.lastCombat = T;
  if (m.state === 'idle') m.state = 'chase';
  if (m.hp <= 0) killMob(m);
}
function xpFor(m){
  if (m.final) return 1500;
  if (m.boss) return 150 + m.lvl * 40;
  return Math.round((8 + m.lvl * 6) * clamp(1 + (m.lvl - P.lvl) * 0.12, 0.05, 1.5) * (m.elite ? 3 : 1));
}
function gainXp(n){
  if (P.lvl >= 20) return;
  P.xp += n;
  while (P.lvl < 20 && P.xp >= xpNeed(P.lvl)){
    P.xp -= xpNeed(P.lvl); P.lvl++;
    P.hp = maxHp(); P.mp = maxMp();
    fxs.push({ k:'ring', x:P.x, y:P.y, r:2.4, t:0, d:0.8, col:'#f2c75c' });
    showBanner('SEVİYE ' + P.lvl, 'Can ve mana doldu', '#f2c75c');
    say('Seviye atladın! Sv ' + P.lvl + '.', '#f2c75c');
    var un = K.ab.filter(function(a){ return a.lv === P.lvl; });
    un.forEach(function(a){ say('Yeni yetenek: ' + a.n + '.', '#f2c75c'); });
    if (P.lvl === 4) say('Binek açıldı. Savaş dışındayken 🐎 tuşuna bas.', '#f2c75c');
  }
  if (P.lvl >= 20) P.xp = 0;
}
function rollLoot(m){
  if (!m.boss && !m.elite && Math.random() > 0.3) return;
  var roll = rnd(100), acc = 0, ri = 0, i;
  if (m.final) ri = 3;
  else if (m.boss) ri = Math.random() < 0.35 ? 3 : 2;
  else { for (i = 0; i < RAR.length; i++){ acc += RAR[i].w; if (roll < acc){ ri = i; break; } } if (m.elite && ri < 1) ri = 1; }
  var r = RAR[ri], isWep = Math.random() < 0.5;
  var nouns = isWep ? K.wn : K.an, name = r.pre[rnd(r.pre.length)] + ' ' + nouns[rnd(nouns.length)];
  var bonus = isWep ? Math.round(r.mult * (1 + m.lvl * 0.9)) : Math.round(r.mult * (0.8 + m.lvl * 0.5));
  var cur = isWep ? (P.wep ? P.wep.b : 0) : (P.arm ? P.arm.b : 0);
  if (bonus > cur){
    var it = { n:name, c:r.c, b:bonus, r:r.n };
    if (isWep) P.wep = it; else P.arm = it;
    say('Ganimet: [' + name + '] (' + r.n + ') +' + bonus + (isWep ? ' saldırı' : ' zırh') + ', kuşandın.', r.c);
  } else {
    var g = Math.max(1, bonus * 3);
    P.gold += g;
    say('Ganimet: [' + name + '] satıldı, +' + g + ' altın.', r.c);
  }
}
function killMob(m){
  m.dead = true; m.diedAt = T; m.respawn = T + (m.boss ? 240 : 35); m.state = 'idle';
  if (P.target === m) P.target = null;
  P.kills++;
  var xp = xpFor(m), rb = P.lvl < 20 ? Math.round(Math.min(P.rest, xp)) : 0;
  P.rest -= rb; xp += rb;
  say(m.name + ' öldü. +' + xp + ' tecrübe' + (rb ? ' (dinlenmiş +' + rb + ')' : '') + '.', '#cfd8d8');
  floatText(P.x, P.y - 0.9, '+' + xp + ' TP', '#c9a0ff', false);
  var g = m.final ? 500 : m.boss ? m.lvl * 25 : Math.round((1 + m.lvl * 1.6) * (0.6 + Math.random() * 0.8) * (m.elite ? 3 : 1));
  P.gold += g;
  gainXp(xp);
  rollLoot(m);
  Object.keys(quests).forEach(function(id){
    var s = quests[id], q = qById(id);
    if (s.st === 'active' && q.kind === 'kill' && q.target === m.name){
      s.p = Math.min(q.n, (s.p || 0) + 1);
      say('Görev: ' + q.target + ' ' + s.p + '/' + q.n, '#f2c75c');
      if (s.p >= q.n){ s.st = 'ready'; say('Görev hazır: ' + q.title + '. Teslim et.', '#f2c75c'); }
    }
  });
  if (m.boss){
    P.bossKills++;
    if (m.final){ showBanner('ZAFER', 'Buz Ejderhası yenildi', '#f2c75c'); say('Buz Ejderhası yenildi! Efsane oldun.', '#c26bff'); awardAch(ACHBY.bf); }
    else { showBanner('Patron Yenildi', m.name, '#f2c75c'); say(m.name + ' yenildi!', '#c26bff'); }
  }
  if (P.auto) pickNext();
}
function pickNext(){
  var best = null, bd = 1e9;
  mobs.forEach(function(m){ if (!m.dead && m.state === 'chase'){ var d = dist(P, m); if (d < 8 && d < bd){ bd = d; best = m; } } });
  P.target = best;
  if (!best) P.auto = false;
}
function nearestMob(maxD){
  var best = null, bd = maxD;
  mobs.forEach(function(m){ if (!m.dead){ var d = dist(P, m); if (d < bd){ bd = d; best = m; } } });
  return best;
}
function validTarget(){ return P.target && !P.target.dead; }
function hurtPlayer(raw, m){
  var red = armTotal() / (armTotal() + 25 + m.lvl * 3.5);
  var d = Math.max(1, Math.round(raw * (1 - red)));
  var ab = Math.min(P.shield, d);
  P.shield -= ab; d -= ab;
  P.hp -= d; P.lastCombat = T; dismount();
  floatText(P.x, P.y - 0.7, ab && !d ? 'Emildi' : '-' + d, '#ff6a5a', false);
  flash = 0.25;
  if (P.hp <= 0 && !P.dead) die();
}
var flash = 0;
function die(){
  P.hp = 0; P.dead = true; P.auto = false; P.target = null; P.cast = null; paused = true; joy.x = joy.y = 0;
  showOverlay(function(box){
    box.appendChild(h('h2', 'Öldün'));
    box.appendChild(h('p', 'Ruhun en yakın köyün şifacısına çekiliyor.'));
    var b = h('button', 'Ruh Şifacısı\'nda dirilt'); b.className = 'primary'; b.type = 'button';
    b.addEventListener('click', respawn); box.appendChild(b);
  });
}
function respawn(){
  var t = TOWNS[nearestTown(P.x, P.y)];
  P.x = t.x + 0.5; P.y = t.y + 2.5; P.hp = Math.round(maxHp() * 0.5); P.mp = Math.round(maxMp() * 0.5); P.dead = false; P.shield = 0;
  mobs.forEach(function(m){ if (m.state === 'chase') evade(m); });
  hideOverlay(); paused = false; say('Dirildin. Dikkatli ol.', '#f2c75c'); save();
}
function flyTo(t, price){
  if (P.gold < price){ say('Yeterli altının yok.'); return; }
  P.gold -= price; P.x = t.x + 0.5; P.y = t.y + 2.5; P.mounted = false; P.target = null; P.auto = false; P.cast = null;
  if (P.pet){ P.pet.x = P.x - 1; P.pet.y = P.y; }
  mobs.forEach(function(m){ if (m.state === 'chase') evade(m); });
  closeSheet(); revealAround(P.x, P.y, 9); say(t.name + '\'e uçtun.', '#f2c75c'); save();
}
function evade(m){ m.state = 'idle'; m.x = m.hx; m.y = m.hy; m.hp = m.max; m.stuck = 0; if (P.target === m) P.target = null; }

function playerTarget(range){
  if (validTarget() && dist(P, P.target) <= range) return P.target;
  var m = nearestMob(range);
  if (m) P.target = m;
  return m;
}
function doBasic(t){
  var r = roll(atkTotal() * 0.9);
  dismount();
  if (K.range > 2) fxs.push({ k:'bolt', x0:P.x, y0:P.y, x1:t.x, y1:t.y, t:0, d:0.16, col:K.col });
  else fxs.push({ k:'ring', x:t.x, y:t.y, r:0.6, t:0, d:0.18, col:'#ffffff' });
  takeDamage(t, r);
}
function useAbility(i, done){
  if (!P || P.dead || paused) return;
  if (P.cast && !done) return;
  var ab = K.ab[i];
  if (P.lvl < ab.lv){ say(ab.n + ' için seviye ' + ab.lv + ' gerekli.'); return; }
  if (P.cd[i] > 0 || P.gcd > 0) return;
  if (P.mp < ab.mp){ say('Yetersiz mana.', '#6aa8ff'); return; }
  if (ab.ct && !done){
    if ((ab.t === 'bolt' || ab.t === 'meteor') && !playerTarget(ab.r)){ say('Menzilde hedef yok.'); return; }
    if (ab.t === 'heal' && P.hp >= maxHp()){ say('Canın zaten dolu.'); return; }
    P.cast = { i:i, t:0, ct:ab.ct }; P.gcd = 0.5; dismount(); return;
  }
  var A = atkTotal(), t, hits;
  if (ab.t === 'strike' || ab.t === 'bolt'){
    t = playerTarget(ab.r);
    if (!t){ say('Menzilde hedef yok.'); return; }
    P.mp -= ab.mp; P.cd[i] = ab.cd; P.gcd = 0.5; dismount();
    if (ab.t === 'bolt') fxs.push({ k:'bolt', x0:P.x, y0:P.y, x1:t.x, y1:t.y, t:0, d:0.2, col:ab.col, big:true });
    else fxs.push({ k:'ring', x:t.x, y:t.y, r:0.9, t:0, d:0.25, col:'#ffb070' });
    takeDamage(t, roll(A * ab.m), '#ffe0a0');
    P.auto = true;
  } else if (ab.t === 'nova' || ab.t === 'smite'){
    hits = mobs.filter(function(m){ return !m.dead && dist(P, m) <= ab.r; });
    if (!hits.length){ say('Yakında hedef yok.'); return; }
    P.mp -= ab.mp; P.cd[i] = ab.cd; P.gcd = 0.5; dismount();
    fxs.push({ k:'ring', x:P.x, y:P.y, r:ab.r, t:0, d:0.5, col:ab.col || '#ffffff' });
    hits.forEach(function(m){ takeDamage(m, roll(A * ab.m), '#ffe0a0'); if (ab.slow) m.slowT = 3; });
    if (ab.t === 'smite'){ var hl = Math.round(A * ab.h); P.hp = Math.min(maxHp(), P.hp + hl); floatText(P.x, P.y - 0.9, '+' + hl, '#43d17f', false); }
    if (!validTarget()){ P.target = hits[0].dead ? null : hits[0]; }
  } else if (ab.t === 'shield'){
    P.mp -= ab.mp; P.cd[i] = ab.cd; P.gcd = 0.5;
    P.shield = ab.a + ab.pl * P.lvl; P.shieldT = 10;
    fxs.push({ k:'ring', x:P.x, y:P.y, r:1.3, t:0, d:0.5, col:K.col });
    say(ab.n + ': ' + P.shield + ' hasar emecek.', K.col);
  } else if (ab.t === 'heal'){
    if (P.hp >= maxHp()){ say('Canın zaten dolu.'); return; }
    P.mp -= ab.mp; P.cd[i] = ab.cd; P.gcd = 0.5;
    var hv = Math.min(maxHp() - P.hp, Math.round(ab.a + ab.m * A));
    P.hp += hv;
    floatText(P.x, P.y - 0.9, '+' + hv, '#43d17f', false);
    fxs.push({ k:'ring', x:P.x, y:P.y, r:1.2, t:0, d:0.5, col:'#43d17f' });
  } else if (ab.t === 'meteor'){
    t = playerTarget(ab.r);
    if (!t){ say('Menzilde hedef yok.'); return; }
    P.mp -= ab.mp; P.cd[i] = ab.cd; P.gcd = 0.5; dismount();
    var tx = t.x, ty = t.y, dm = A * ab.m, ar = ab.ar;
    fxs.push({ k:'meteor', x:tx, y:ty, ic:ab.mic, t:0, d:0.7, done:function(){
      fxs.push({ k:'ring', x:tx, y:ty, r:ar, t:0, d:0.5, col:ab.col });
      mobs.forEach(function(m){ if (!m.dead && Math.hypot(m.x - tx, m.y - ty) <= ar) takeDamage(m, roll(dm), '#ffd0a0'); });
    }});
    P.auto = true;
  }
}
function usePotion(){
  if (!P || P.dead || paused) return;
  if (P.pots <= 0){ say('İksirin kalmadı. Şifalı otlardan toplayabilir veya satın alabilirsin.'); return; }
  if (P.potCd > 0) return;
  if (P.hp >= maxHp() && P.mp >= maxMp()){ say('Can ve manan dolu.'); return; }
  P.pots--; P.potCd = 15;
  var h1 = Math.min(maxHp() - P.hp, Math.round(maxHp() * 0.45));
  P.hp += h1; P.mp = Math.min(maxMp(), P.mp + Math.round(maxMp() * 0.3));
  floatText(P.x, P.y - 0.9, '+' + h1, '#43d17f', false);
  fxs.push({ k:'ring', x:P.x, y:P.y, r:1, t:0, d:0.45, col:'#43d17f' });
}
function toggleMount(){
  if (!P || P.dead || paused) return;
  if (P.lvl < 4){ say('Binek için seviye 4 gerekli.'); return; }
  if (P.mounted){ P.mounted = false; return; }
  if (inCombat()){ say('Savaştayken bineğe binemezsin.'); return; }
  P.mounted = true; P.auto = false;
}
function toggleAttack(){
  if (!P || P.dead || paused) return;
  if (P.auto){ P.auto = false; return; }
  if (!validTarget()){ var m = nearestMob(9); if (!m){ say('Yakında düşman yok.'); return; } P.target = m; }
  P.auto = true; dismount();
}

/* ---------- güncelleme ---------- */
function update(dt){
  T += dt;
  var i, ix = joy.x, iy = joy.y;
  if (keys.ArrowLeft || keys.a) ix -= 1;
  if (keys.ArrowRight || keys.d) ix += 1;
  if (keys.ArrowUp || keys.w) iy -= 1;
  if (keys.ArrowDown || keys.s) iy += 1;
  var len = Math.hypot(ix, iy);
  if (len > 1){ ix /= len; iy /= len; len = 1; }
  var moving = len > 0.15;
  var sp = 3.4 * (P.mounted ? 1.8 : 1) * (P.slowT > 0 ? 0.5 : 1);
  if (moving) moveEnt(P, ix * sp * dt * Math.min(1, len * 1.2), iy * sp * dt * Math.min(1, len * 1.2), 0.28);
  else if (P.auto && validTarget() && !P.cast){
    var d0 = dist(P, P.target), need = K.range * 0.8;
    if (d0 > need){ var vx = (P.target.x - P.x) / d0, vy = (P.target.y - P.y) / d0; moveEnt(P, vx * sp * dt, vy * sp * dt, 0.28); }
  }
  if (P.cast){
    if (moving){ P.cast = null; say('Büyü yarıda kesildi.', '#ff9a8a'); }
    else { P.cast.t += dt; if (P.cast.t >= P.cast.ct){ var ci = P.cast.i; P.cast = null; useAbility(ci, true); } }
  }
  if (validTarget() && dist(P, P.target) > 14){ P.target = null; P.auto = false; }
  P.atkT = Math.max(0, P.atkT - dt); P.gcd = Math.max(0, P.gcd - dt); P.potCd = Math.max(0, P.potCd - dt);
  P.slowT = Math.max(0, P.slowT - dt);
  for (i = 0; i < 4; i++) P.cd[i] = Math.max(0, P.cd[i] - dt);
  if (P.shieldT > 0){ P.shieldT -= dt; if (P.shieldT <= 0) P.shield = 0; }
  if (P.auto && !P.cast){
    if (!validTarget()) pickNext();
    if (validTarget()){
      var dd = dist(P, P.target);
      if (dd <= K.range && P.atkT <= 0){ doBasic(P.target); P.atkT = K.aspd; }
    }
  }
  var ooc = !inCombat();
  P.hp = Math.min(maxHp(), P.hp + (ooc ? maxHp() * 0.02 : 0.2) * dt);
  P.mp = Math.min(maxMp(), P.mp + (1.4 + P.lvl * 0.15 + (ooc ? maxMp() * 0.03 : 0)) * dt);

  for (i = 0; i < herbs.length; i++){
    var hb = herbs[i];
    if (hb.at > T) continue;
    if (Math.hypot(P.x - hb.x, P.y - hb.y) < 0.8){
      hb.at = T + 60;
      if (P.pots < 9){ P.pots++; say('Şifalı ot topladın: iksir +1 (' + P.pots + ').', '#43d17f'); }
      else say('İksir çantan dolu.');
    }
  }

  mobsUpdate(dt);

  if (townId >= 0 && P.lvl < 20) P.rest = Math.min(xpNeed(P.lvl) * 1.5, P.rest + dt * xpNeed(P.lvl) * 0.006);
  if (P.pet){
    var pt = P.pet, tgt = validTarget() ? P.target : null, gx, gy, gd;
    if (tgt && inCombat()){ gx = tgt.x; gy = tgt.y; gd = 1.0; } else { gx = P.x - 0.8; gy = P.y + 0.4; gd = 1.2; }
    var pdist = Math.hypot(gx - pt.x, gy - pt.y);
    if (pdist > 14){ pt.x = P.x; pt.y = P.y; }
    else if (pdist > gd){ moveEnt(pt, (gx - pt.x) / pdist * 4.2 * dt, (gy - pt.y) / pdist * 4.2 * dt, 0.25); }
    pt.atkT = Math.max(0, pt.atkT - dt);
    if (tgt && Math.hypot(tgt.x - pt.x, tgt.y - pt.y) <= 1.5 && pt.atkT <= 0){ pt.atkT = 1.4; takeDamage(tgt, roll(atkTotal() * 0.45), '#d8e8a0'); }
  }
  achT -= dt; if (achT <= 0){ achT = 1; checkAch(); }

  for (i = fxs.length - 1; i >= 0; i--){
    var f = fxs[i]; f.t += dt;
    if (f.t >= f.d){ if (f.done) f.done(); fxs.splice(i, 1); }
  }
  for (i = floats.length - 1; i >= 0; i--){ floats[i].t += dt; if (floats[i].t > 1.1) floats.splice(i, 1); }

  exploreT -= dt;
  if (exploreT <= 0){ exploreT = 0.4; revealAround(P.x, P.y, 7); }

  var z = zoneMap[idx(clamp(Math.floor(P.x), 0, TW - 1), clamp(Math.floor(P.y), 0, TH - 1))];
  if (z !== zoneId){
    zoneId = z;
    var zn = ZONES[z];
    showBanner(zn.name, 'Seviye ' + zn.lo + '-' + zn.hi, zn.col);
    say(zn.name + ' bölgesine girdin (Sv ' + zn.lo + '-' + zn.hi + ').', zn.col);
  }
  var tw = nearTown(P.x, P.y, 6.5);
  if (tw !== townId){
    townId = tw;
    if (tw >= 0){ TOWNS[tw].seen = true; showBanner(TOWNS[tw].name, 'Güvenli bölge', '#f2c75c'); }
  }

  hudT -= dt; saveT -= dt;
  if (hudT <= 0){ hudT = 0.1; updateHud(); }
  if (saveT <= 0){ saveT = 8; save(); }
}
function mobsUpdate(dt){
  for (var i = 0; i < mobs.length; i++){
    var m = mobs[i];
    if (m.dead){
      if (T >= m.respawn){ m.dead = false; m.hp = m.max; m.x = m.hx; m.y = m.hy; m.state = 'idle'; }
      continue;
    }
    var d = dist(P, m);
    if (d > 32 && m.state === 'idle') continue;
    m.slowT = Math.max(0, m.slowT - dt);
    m.atkT = Math.max(0, m.atkT - dt);
    var sp = m.sp * (m.slowT > 0 ? 0.5 : 1);
    if (m.state === 'idle'){
      m.wT -= dt;
      if (m.wT <= 0){ m.wT = 2 + Math.random() * 4; var a = Math.random() * 6.283, rr = Math.random() * 2.5; m.wx = m.hx + Math.cos(a) * rr; m.wy = m.hy + Math.sin(a) * rr; }
      var wd = Math.hypot(m.wx - m.x, m.wy - m.y);
      if (wd > 0.15) moveEnt(m, (m.wx - m.x) / wd * 0.8 * dt, (m.wy - m.y) / wd * 0.8 * dt, 0.3);
      if (!P.dead && d < m.ag && m.lvl > P.lvl - 6 && nearTown(m.x, m.y, 6.5) < 0 && nearTown(P.x, P.y, 6.5) < 0){ m.state = 'chase'; m.stuck = 0; }
    } else {
      if (P.dead || Math.hypot(m.x - m.hx, m.y - m.hy) > 16 || nearTown(m.x, m.y, 6.5) >= 0 || m.stuck > 3){ evade(m); continue; }
      if (d > 1.0){
        var ox = m.x, oy = m.y;
        moveEnt(m, (P.x - m.x) / d * sp * dt, (P.y - m.y) / d * sp * dt, 0.3);
        if (Math.hypot(m.x - ox, m.y - oy) < sp * dt * 0.2) m.stuck += dt; else m.stuck = Math.max(0, m.stuck - dt);
      } else if (m.atkT <= 0){
        m.atkT = m.boss ? 1.6 : 1.5;
        if (Math.random() < 0.8) hurtPlayer(m.dmg * (0.8 + Math.random() * 0.4), m);
        else floatText(P.x, P.y - 0.7, 'Iska', '#cfd8d8', false);
      }
    }
  }
}

/* ---------- görev ve diyalog ---------- */
function qById(id){ for (var i = 0; i < QUESTS.length; i++) if (QUESTS[i].id === id) return QUESTS[i]; return null; }
function qState(q){
  var s = quests[q.id];
  if (s) return s.st;
  if (P.lvl >= q.lvl && (!q.prev || (quests[q.prev] && quests[q.prev].st === 'done'))) return 'avail';
  return 'none';
}
function activeCount(){ return Object.keys(quests).filter(function(k){ return quests[k].st === 'active' || quests[k].st === 'ready'; }).length; }
function npcMarker(n){
  var st = '';
  QUESTS.forEach(function(q){
    var s = qState(q), turn = q.turn || q.giver;
    if (s === 'ready' && turn === n.id) st = '?';
    else if (s === 'active' && turn === n.id && st !== '?') st = 'g';
    else if (s === 'avail' && q.giver === n.id && st === '') st = '!';
  });
  return st;
}
function acceptQuest(q){
  if (activeCount() >= 6){ say('Görev günlüğün dolu.'); return false; }
  quests[q.id] = { st: q.kind === 'deliver' ? 'ready' : 'active', p:0 };
  say('Görev alındı: ' + q.title + '.', '#f2c75c');
  return true;
}
function turnIn(q){
  quests[q.id].st = 'done';
  P.gold += q.gold; gainXp(q.xp);

function drawWorld(){
  ctx.fillStyle = '#0b1115'; ctx.fillRect(0, 0, W, H);
  var hx = W / 2 / TS, hy = H / 2 / TS;
  var x0 = Math.floor(camX - hx) - 1, x1 = Math.ceil(camX + hx) + 1, y0 = Math.floor(camY - hy) - 1, y1 = Math.ceil(camY + hy) + 1;
  var tx, ty, list = [];
  for (ty = y0; ty <= y1; ty++) for (tx = x0; tx <= x1; tx++){
    if (!inB(tx, ty)) continue;
    var i = idx(tx, ty), t = tiles[i], hv = hash(tx, ty);
    var px = sxOf(tx), py = syOf(ty), s = Math.ceil(TS) + 1;
    ctx.fillStyle = PAL[t][Math.floor(hv * 4) % 4];

      if (hv > 0.55){ ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(px + (Math.sin(T * 1.6 + tx * 1.3 + ty) * 0.15 + 0.3) * TS, py + 0.45 * TS, 0.4 * TS, Math.max(2, TS * 0.05)); }
    } else if (t === T_GRASS || t === T_FOREST){
      var h2 = hash(tx + 91, ty + 17);
      if (h2 < 0.07){ ctx.fillStyle = h2 < 0.025 ? '#ffd84a' : (h2 < 0.05 ? '#ff8ab0' : '#ffffff'); ctx.fillRect(px + hv * 0.7 * TS + TS * 0.1, py + h2 * 9 * TS, Math.max(3, TS * 0.1), Math.max(3, TS * 0.1)); }
    } else if (t === T_SAND){
      if (hv < 0.18){ ctx.fillStyle = 'rgba(120,90,40,.25)'; ctx.fillRect(px + hv * 4 * TS, py + 0.5 * TS, TS * 0.2, Math.max(2, TS * 0.05)); }
    } else if (t === T_SNOW){
      if (hv < 0.1){ ctx.fillStyle = 'rgba(140,190,230,.35)'; ctx.fillRect(px + hv * 8 * TS, py + 0.4 * TS, TS * 0.15, TS * 0.15); }
    } else if (t === T_ROAD){
      if (hv < 0.2){ ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(px + hv * 4 * TS, py + 0.4 * TS, TS * 0.18, TS * 0.12); }
    }
    var d = deco[i];
    if (d) list.push({ y:ty + 0.5, k:0, d:d, x:tx + 0.5 });
  }
  var i2;
  for (i2 = 0; i2 < herbs.length; i2++){ var hb = herbs[i2]; if (hb.at <= T && hb.x > x0 && hb.x < x1 && hb.y > y0 && hb.y < y1) list.push({ y:hb.y, k:1, o:hb }); }
  for (i2 = 0; i2 < npcs.length; i2++){ var n = npcs[i2]; if (n.x > x0 && n.x < x1 && n.y > y0 && n.y < y1) list.push({ y:n.y, k:2, o:n }); }
  for (i2 = 0; i2 < mobs.length; i2++){ var m = mobs[i2]; if (m.x > x0 && m.x < x1 && m.y > y0 && m.y < y1 && (!m.dead || T - m.diedAt < 1.2)) list.push({ y:m.y, k:3, o:m }); }
  list.push({ y:P.y, k:4 });
  if (P.pet) list.push({ y:P.pet.y, k:5 });
  list.sort(function(a, b){ return a.y - b.y; });
  for (i2 = 0; i2 < list.length; i2++){
    var it = list[i2];
    if (it.k === 0){ var dc = DECOS[it.d]; drawSpr(dc.c, it.x, it.y - (dc.s - 1) * 0.3, dc.s); }
    else if (it.k === 1){ drawSpr('🌿', it.o.x, it.o.y, 0.8); }
    else if (it.k === 2){
      var nn = it.o; shadow(nn.x, nn.y, 0.3); drawSpr(nn.c, nn.x, nn.y, 1);
      var mk = npcMarker(nn);
      if (mk){
        ctx.font = '800 ' + Math.round(TS * 0.7) + 'px "JetBrains Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3; ctx.strokeStyle = '#000'; var yy = syOf(nn.y) - TS * 0.78 + Math.sin(T * 4) * 2;
        var ch = mk === '!' ? '!' : '?'; ctx.strokeText(ch, sxOf(nn.x), yy);
        ctx.fillStyle = mk === 'g' ? '#9d9d9d' : '#f2c75c'; ctx.fillText(ch, sxOf(nn.x), yy);
      }
      ctx.font = '800 ' + Math.round(TS * 0.26) + 'px "JetBrains Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(nn.name, sxOf(nn.x), syOf(nn.y) + TS * 0.62);
      ctx.fillStyle = '#7fe08a'; ctx.fillText(nn.name, sxOf(nn.x), syOf(nn.y) + TS * 0.62);
    } else if (it.k === 3){
      var mm = it.o, sc = mm.final ? 2.6 : mm.boss ? 1.8 : mm.elite ? 1.25 : 1, al = mm.dead ? 1 - (T - mm.diedAt) / 1.2 : 1;
      var bob = mm.state === 'chase' ? Math.sin(T * 10 + mm.id) * 0.05 : 0;
      if (!mm.dead) shadow(mm.x, mm.y, mm.boss ? 0.9 : 0.3);
      if (P.target === mm){
        ctx.strokeStyle = '#f2c75c'; ctx.lineWidth = Math.max(2, TS * 0.06);
        ctx.beginPath(); ctx.ellipse(sxOf(mm.x), syOf(mm.y) + TS * 0.3, TS * (mm.boss ? 1.1 : 0.45), TS * (mm.boss ? 0.45 : 0.2), 0, 0, 6.283); ctx.stroke();
      }
      drawSpr(mm.c, mm.x, mm.y + bob - (sc - 1) * 0.3, sc, al);
      if (!mm.dead && (mm.hp < mm.max || P.target === mm)) bar(mm.x, mm.y - (sc - 1) * 0.55, mm.hp / mm.max, mm.final ? 1.6 : mm.boss ? 1.2 : mm.elite ? 1.0 : 0.8);
    } else if (it.k === 5){
      shadow(P.pet.x, P.pet.y, 0.28); drawSpr('🐺', P.pet.x, P.pet.y, 0.95);
    } else {
      shadow(P.x, P.y, P.mounted ? 0.5 : 0.3);
      var wob = (Math.abs(joy.x) + Math.abs(joy.y) > 0.1 || keys.w || keys.a || keys.s || keys.d) ? Math.sin(T * 14) * 0.03 : 0;
      if (P.mounted){ drawSpr('🐎', P.x, P.y + wob, 1.4); drawSpr(K.spr, P.x, P.y - 0.42 + wob, 0.8); }
      else drawSpr(K.spr, P.x, P.y + wob, 1.05);
      if (P.shield > 0){
        ctx.strokeStyle = K.col; ctx.lineWidth = Math.max(2, TS * 0.06); ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(sxOf(P.x), syOf(P.y), TS * 0.62, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
  }
  /* efektler */
  fxs.forEach(function(f){
    var p = clamp(f.t / f.d, 0, 1);
    if (f.k === 'bolt'){
      var bx = f.x0 + (f.x1 - f.x0) * p, by = f.y0 + (f.y1 - f.y0) * p;
      ctx.fillStyle = f.col; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(sxOf(bx), syOf(by), TS * (f.big ? 0.22 : 0.13), 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
    } else if (f.k === 'ring'){
      ctx.strokeStyle = f.col; ctx.lineWidth = Math.max(2, TS * 0.08); ctx.globalAlpha = 1 - p;
      ctx.beginPath(); ctx.arc(sxOf(f.x), syOf(f.y), TS * f.r * (0.25 + 0.75 * p), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.k === 'meteor'){
      var my = f.y - 6 * (1 - p);
      drawSpr(f.ic || '☄️', f.x, my, 1.4);
      ctx.strokeStyle = 'rgba(255,120,60,.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(sxOf(f.x), syOf(f.y), TS * 1.4 * p, TS * 0.6 * p, 0, 0, 6.283); ctx.stroke();
    }
  });
  /* yüzen yazılar */
  floats.forEach(function(f){
    var yy = syOf(f.y) - f.t * TS * 0.9;
    ctx.globalAlpha = f.t > 0.7 ? 1 - (f.t - 0.7) / 0.4 : 1;
    ctx.font = '800 ' + Math.round(TS * (f.big ? 0.56 : 0.38)) + 'px "JetBrains Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = '#000';
    ctx.strokeText(f.text, sxOf(f.x), yy); ctx.fillStyle = f.col; ctx.fillText(f.text, sxOf(f.x), yy);
    ctx.globalAlpha = 1;
  });
  /* gece */
  var dayT = (T / 240) % 1, light = 0.5 + 0.5 * Math.cos(dayT * 6.283);
  var night = clamp((0.35 - light) / 0.35, 0, 1) * 0.5;
  if (night > 0.01){
    var gx = sxOf(P.x), gy = syOf(P.y);
    var gr = ctx.createRadialGradient(gx, gy, TS * 1.5, gx, gy, TS * 7);
    gr.addColorStop(0, 'rgba(6,12,44,' + (night * 0.15) + ')'); gr.addColorStop(1, 'rgba(6,12,44,' + night + ')');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  /* kar */
  if (zoneId === 3){
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    snow.forEach(function(s){ s.y += s.v * 0.016; s.x += Math.sin(T + s.p) * 0.3; if (s.y > H){ s.y = -4; s.x = Math.random() * W; } ctx.fillRect(s.x, s.y, s.r, s.r); });
  }
  if (flash > 0){ ctx.fillStyle = 'rgba(220,40,30,' + flash + ')'; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - 0.016); }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  var w = cv.clientWidth, hh = cv.clientHeight;
  if (!w || !hh) return;
  cv.width = Math.round(w * DPR); cv.height = Math.round(hh * DPR);
  W = cv.width; H = cv.height;
  TS = Math.round(Math.max(32, w / 9.5) * DPR);
  var mw = $('#mmw').clientWidth || 92;
  mmc.width = Math.round(mw * DPR); mmc.height = Math.round(mw * DPR);
  snow = [];
  for (var i = 0; i < 45; i++) snow.push({ x:Math.random() * W, y:Math.random() * H, v:40 + Math.random() * 60, r:Math.max(2, DPR * 2), p:Math.random() * 6 });
}

/* ---------- girdi ---------- */
var jp = null;
function showJoy(x, y){ var j = $('#joy'); j.style.left = x + 'px'; j.style.top = y + 'px'; j.style.display = 'block'; $('#knob').style.transform = 'translate(0,0)'; }
function hideJoy(){ $('#joy').style.display = 'none'; }
function tapWorld(sx, sy){
  if (!P || paused) return;
  var wx = (sx * DPR - W / 2) / TS + camX, wy = (sy * DPR - H / 2) / TS + camY;
  var bm = null, bd = 0.95;
  mobs.forEach(function(m){ if (!m.dead){ var d = Math.hypot(m.x - wx, (m.y - (m.boss ? 0.5 : 0)) - wy); if (d < bd + (m.boss ? 0.8 : 0)){ bd = d; bm = m; } } });
  var bn = null, nd = 1.0;
  npcs.forEach(function(n){ var d = Math.hypot(n.x - wx, n.y - wy); if (d < nd){ nd = d; bn = n; } });
  if (bn && (!bm || nd < bd)){
    if (dist(P, bn) <= 3.2) openDialog(bn); else say('Çok uzaksın. ' + bn.name + ' ile konuşmak için yaklaş.');
    return;
  }
  if (bm) P.target = bm;
}
cv.addEventListener('pointerdown', function(e){
  if (paused) return;
  e.preventDefault();
  var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  if (!jp && x < r.width * 0.62 && y > r.height * 0.35){
    jp = { id:e.pointerId, sx:x, sy:y, moved:false, t0:performance.now() };
    showJoy(x, y);
  } else tapWorld(x, y);
});
cv.addEventListener('pointermove', function(e){
  if (!jp || e.pointerId !== jp.id) return;
  var r = cv.getBoundingClientRect(), dx = e.clientX - r.left - jp.sx, dy = e.clientY - r.top - jp.sy;
  var len = Math.hypot(dx, dy);
  if (len > 8) jp.moved = true;
  var k = len > 48 ? 48 / len : 1;
  joy.x = dx * k / 48; joy.y = dy * k / 48;
  $('#knob').style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)';
});
function endJoy(e){
  if (!jp || e.pointerId !== jp.id) return;
  if (!jp.moved && performance.now() - jp.t0 < 350) tapWorld(jp.sx, jp.sy);
  jp = null; joy.x = joy.y = 0; hideJoy();
}
cv.addEventListener('pointerup', endJoy);
cv.addEventListener('pointercancel', endJoy);
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
$('#shX').addEventListener('click', closeSheet);
$('#bChar').addEventListener('click', function(){ if (!P || P.dead) return; if (sheetOpen && sheetKind === 'char') closeSheet(); else openChar(); });
$('#bQuest').addEventListener('click', function(){ if (!P || P.dead) return; if (sheetOpen && sheetKind === 'quest') closeSheet(); else openQuests(); });
$('#bMap').addEventListener('click', function(){ if (!P || P.dead) return; if (sheetOpen && sheetKind === 'map') closeSheet(); else openMap(); });
$('#mmw').addEventListener('click', function(){ if (P && !P.dead) openMap(); });
$('#talk').addEventListener('pointerdown', function(e){ e.preventDefault(); var n = this._n; if (n && !paused) openDialog(n); });

window.addEventListener('keydown', function(e){
  var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (e.target && e.target.tagName === 'INPUT') return;
  if (k === 'Escape'){ closeSheet(); return; }
  if (!P || P.dead) return;
  if (k === 'm'){ if (sheetOpen && sheetKind === 'map') closeSheet(); else openMap(); return; }
  if (k === 'c'){ if (sheetOpen && sheetKind === 'char') closeSheet(); else openChar(); return; }
  if (k === 'q'){ if (sheetOpen && sheetKind === 'quest') closeSheet(); else openQuests(); return; }
  if (paused) return;
  if (k >= '1' && k <= '4'){ e.preventDefault(); useAbility(parseInt(k, 10) - 1); return; }
  if (k === ' '){ e.preventDefault(); toggleAttack(); return; }
  if (k === 'f'){ usePotion(); return; }
  if (k === 'z'){ toggleMount(); return; }
  if (k === 'e'){ var t = $('#talk')._n; if (t) openDialog(t); return; }
  if (k === 'Tab'){ e.preventDefault(); var m = nearestMob(10); if (m) P.target = m; return; }
  keys[k] = true;
  if (k.indexOf('Arrow') === 0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ var k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
document.addEventListener('visibilitychange', function(){ if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ---------- ana menü ---------- */
function mainMenu(){
  paused = true; hideJoy();
  var sv = readSave();
  showOverlay(function(box){
    box.appendChild(h('div', 'Açık Diyar', 'sub'));
    box.appendChild(h('h1', 'Zindan Yürüyüşü'));
    var list = h('div', null, 'choices');
    if (sv){
      var c = CLASSES[sv.cls], b = h('button', null, 'choice'); b.type = 'button';
      b.appendChild(h('span', c.spr, 'em'));
      var d = h('div'); var bb = h('b', 'Devam et: ' + sv.name); bb.style.color = c.col; d.appendChild(bb); d.appendChild(h('small', c.name + ' · Seviye ' + sv.lvl + ' · ' + sv.gold + ' altın')); b.appendChild(d);
      b.addEventListener('click', function(){ loadSave(sv); begin(); });
      list.appendChild(b);
    }
    box.appendChild(list);
    var nb = h('button', sv ? 'Yeni karakter' : 'Maceraya başla'); nb.type = 'button'; nb.className = sv ? 'btn' : 'primary';
    if (sv) nb.style.textAlign = 'center';
    nb.addEventListener('click', createScreen);
    box.appendChild(nb);
  });
}
function createScreen(){
  showOverlay(function(box){
    box.appendChild(h('h2', 'Kahramanını Seç'));
    var inp = document.createElement('input'); inp.id = 'nm'; inp.maxLength = 12; inp.value = 'Kahraman'; inp.setAttribute('aria-label', 'Karakter adı'); inp.autocomplete = 'off';
    box.appendChild(inp);
    var list = h('div', null, 'choices');
    Object.keys(CLASSES).forEach(function(key){
      var c = CLASSES[key], b = h('button', null, 'choice'); b.type = 'button';
      b.appendChild(h('span', c.spr, 'em'));
      var d = h('div'); var bb = h('b', c.name); bb.style.color = c.col; d.appendChild(bb); d.appendChild(h('small', c.desc)); b.appendChild(d);
      b.addEventListener('click', function(){ newPlayer(key, (inp.value || 'Kahraman').trim().slice(0, 12)); say('Diyara hoş geldin, ' + P.name + '.', '#f2c75c'); say('Altınyol\'da Muhtar Belin ile konuş (!).', '#f2c75c'); begin(); });
      list.appendChild(b);
    });
    box.appendChild(list);
    var back = h('button', 'Geri'); back.type = 'button'; back.className = 'btn'; back.style.textAlign = 'center'; back.addEventListener('click', mainMenu);
    box.appendChild(back);
  });
}
function begin(){
  hideOverlay(); closeSheetSilent(); paused = false; P.dead = false;
  zoneId = -1; townId = -1; updateHud(); save();
}
function closeSheetSilent(){ sheetOpen = false; $('#sheet').hidden = true; }

/* ---------- başarımlar ---------- */
function doneQuests(){ var c = 0; Object.keys(quests).forEach(function(k){ if (quests[k].st === 'done') c++; }); return c; }
function exploredPct(){ var c = 0; for (var i = 0; i < explored.length; i++) if (explored[i]) c++; return c / explored.length; }
var ACH = [
  { id:'k1',   n:'İlk Kan',          d:'İlk düşmanını yen.',                p:5,  f:function(){ return P.kills >= 1; } },
  { id:'k100', n:'Avcı',             d:'100 düşman öldür.',                 p:10, f:function(){ return P.kills >= 100; } },
  { id:'l10',  n:'Yükselen Yıldız',  d:'10. seviyeye ulaş.',                p:10, f:function(){ return P.lvl >= 10; } },
  { id:'l20',  n:'Efsane',           d:'20. seviyeye ulaş.',                p:25, f:function(){ return P.lvl >= 20; } },
  { id:'t4',   n:'Gezgin',           d:'Dört köyü de keşfet.',              p:10, f:function(){ return TOWNS.every(function(t){ return t.seen; }); } },
  { id:'b1',   n:'Patron Avcısı',    d:'Bir bölge patronunu yen.',          p:10, f:function(){ return P.bossKills >= 1; } },
  { id:'q10',  n:'Görev Ustası',     d:'10 görev tamamla.',                 p:10, f:function(){ return doneQuests() >= 10; } },
  { id:'g500', n:'Zengin',           d:'500 altın biriktir.',               p:5,  f:function(){ return P.gold >= 500; } },
  { id:'ex50', n:'Kaşif',            d:'Haritanın yarısını keşfet.',        p:10, f:function(){ return exploredPct() >= 0.5; } },
  { id:'bf',   n:'Ejderha Katili',   d:'Buz Ejderhası\'nı yen.',            p:25, f:function(){ return false; } }
];
var ACHBY = {}; ACH.forEach(function(a){ ACHBY[a.id] = a; });
function awardAch(a){
  if (!a || P.ach[a.id]) return;
  P.ach[a.id] = 1; showBanner('Başarım', a.n + ' · ' + a.p + ' puan', '#f2c75c'); say('Başarım kazanıldı: ' + a.n + '.', '#f2c75c');
}
function checkAch(){ for (var i = 0; i < ACH.length; i++){ var a = ACH[i]; if (!P.ach[a.id] && a.f()) awardAch(a); } }

/* ---------- döngü ---------- */
var last = 0;
function frame(ts){
  var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
  if (P){
    if (!paused) update(dt);
    camX = P.x; camY = P.y + 1.3;
    if (W) { drawWorld(); drawMini(); }
  } else if (W){
    camX = 40.5; camY = 62; T += dt;
    ctx.fillStyle = '#0b1115'; ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

resize();
camX = 40.5; camY = 62;
mainMenu();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load){ document.fonts.load('800 20px "JetBrains Mono"').catch(function(){}); }
})();
</script>
</body>
